name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The committed lockfile was generated on Windows. npm has a
      # longstanding bug (npm/cli#4828) where a lockfile written on one
      # platform can permanently omit another platform's optional-dependency
      # entries (rollup's native binary, here) — neither `npm ci` nor a
      # plain `npm install` adds the missing platform's entry on top of an
      # existing lockfile. Dropping the lockfile forces a full, correct,
      # platform-aware resolution on this runner instead — the exact remedy
      # npm's own error message suggests.
      - run: rm -f package-lock.json && npm install

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test --workspace=apps/api

      # The shadow database used by the diff step below must exist as an
      # empty Postgres database — Prisma manages schemas/tables inside it
      # but doesn't create the database itself. The 20260910235959_stub_auth_schema
      # migration (see prisma/migrations/) creates a minimal auth.users
      # ahead of the real migration, in both this database and the shadow
      # one, purely by being replayed in order — no manual seeding needed.
      - name: Create the shadow database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE shadow;"

      # auth.uid() is a Supabase-platform-provided function, real on every
      # Supabase database, never created by any migration here (see the
      # comment on is_admin() in the profiles migration) -- so CI's plain
      # Postgres container needs it stubbed directly, in both the main and
      # shadow databases, before any migration that calls it can apply.
      - name: Stub auth.uid() for CI's plain Postgres
        run: |
          for db in test shadow; do
            psql "postgresql://postgres:postgres@localhost:5432/$db" -c 'CREATE SCHEMA IF NOT EXISTS auth;'
            psql "postgresql://postgres:postgres@localhost:5432/$db" -c 'CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;'
          done

      - name: Apply migrations
        run: npm exec -w apps/api -- prisma migrate deploy

      - run: npm run test:e2e --workspace=apps/api

      - run: npm run build

      # Observability, not a hard gate: auth.users is deliberately not a
      # Prisma model (see schema.prisma), so it always shows up here as a
      # table the migrations create that the schema doesn't know about —
      # that's expected, not drift. Using --exit-code would make this step
      # permanently fail regardless of any *real* future drift, which
      # defeats the point of having it. Printed for a human to skim instead.
      # npm exec -w apps/api already runs with cwd apps/api/, so these
      # paths are relative to there, not the repo root.
      #
      # continue-on-error: --shadow-database-url fully drops and replays
      # every migration from scratch before diffing, which wipes the
      # auth.uid() stub above along with everything else -- and auth.uid()
      # can't live in a migration file (see the comment on is_admin() in
      # the profiles migration), so this replay now hits P3006 every run,
      # not a real diff. Left in for whenever a future fix makes the replay
      # itself stubbable, rather than deleting the diagnostic outright.
      - name: Prisma migrate diff (informational)
        continue-on-error: true
        run: >-
          npm exec -w apps/api -- prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"

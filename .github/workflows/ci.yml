name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The committed lockfile was generated on Windows. npm has a
      # longstanding bug (npm/cli#4828) where a lockfile written on one
      # platform can permanently omit another platform's optional-dependency
      # entries (rollup's native binary, here) — neither `npm ci` nor a
      # plain `npm install` adds the missing platform's entry on top of an
      # existing lockfile. Dropping the lockfile forces a full, correct,
      # platform-aware resolution on this runner instead — the exact remedy
      # npm's own error message suggests.
      - run: rm -f package-lock.json && npm install

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test --workspace=apps/api

      # Vanilla Postgres has no auth schema — profiles' FK references
      # auth.users, which is normally Supabase-managed. Stub it here (in
      # both the test DB and the shadow DB used by the diff step below) so
      # the real migration can apply as-is.
      - name: Bootstrap a stub auth.users
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE shadow;"
          for db in test shadow; do
            psql "postgresql://postgres:postgres@localhost:5432/$db" -c "CREATE SCHEMA IF NOT EXISTS auth;"
            psql "postgresql://postgres:postgres@localhost:5432/$db" -c "CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);"
          done

      # Plain `prisma migrate deploy` refuses to run against a database that
      # already has tables in a schema it manages (P3005 "schema is not
      # empty") — and since auth.users must already exist for this
      # migration's FK to succeed, that guard always fires here (and will
      # against the real Supabase database too, which always has a
      # pre-existing auth schema). The standard fix for exactly this
      # Prisma+Supabase situation: apply the SQL directly, then tell Prisma
      # to record it as applied (baseline), rather than have `migrate
      # deploy` apply it itself. See https://pris.ly/d/migrate-baseline —
      # this is the same P3005 error message's own suggested remedy.
      - name: Apply migrations
        run: |
          npm exec -w apps/api -- prisma db execute \
            --file prisma/migrations/20260911000000_init/migration.sql \
            --schema prisma/schema.prisma
          npm exec -w apps/api -- prisma migrate resolve \
            --applied 20260911000000_init

      - run: npm run test:e2e --workspace=apps/api

      - run: npm run build

      - name: Prisma migrate diff sanity check
        # npm exec -w apps/api already runs with cwd apps/api/, so these
        # paths are relative to there, not the repo root.
        run: >-
          npm exec -w apps/api -- prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

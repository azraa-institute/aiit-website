name: Deploy

# apps/web deploys independently via Vercel's own GitHub integration once
# its Root Directory is set to apps/web — no step for it here.
#
# Single environment for now ("production") — there is no second Render
# service yet. Add a staging job here once one exists; same shape, different
# secrets/env.

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # apps/api has no native-binary deps affected by the lockfile issue
      # described in ci.yml, so a plain install is fine here.
      - run: npm install --workspace=apps/api

      # IMPORTANT — one-time manual step before this can succeed:
      # `prisma migrate deploy` refuses to run against a database that
      # already has tables in a schema it manages (P3005 "schema is not
      # empty"). Supabase's `auth` schema always pre-exists, so the very
      # first run of this workflow against a real Supabase DATABASE_URL
      # will hit this. Before that first run, baseline BOTH migrations by
      # hand, in order (see https://pris.ly/d/migrate-baseline):
      #   npx prisma db execute --file apps/api/prisma/migrations/20260910235959_stub_auth_schema/migration.sql --schema apps/api/prisma/schema.prisma --url "$DATABASE_URL"
      #   npx prisma db execute --file apps/api/prisma/migrations/20260911000000_init/migration.sql --schema apps/api/prisma/schema.prisma --url "$DATABASE_URL"
      #   npx prisma migrate resolve --applied 20260910235959_stub_auth_schema --schema apps/api/prisma/schema.prisma
      #   npx prisma migrate resolve --applied 20260911000000_init --schema apps/api/prisma/schema.prisma
      # (the stub migration's CREATE ... IF NOT EXISTS is a no-op against
      # real Supabase, which already has auth.users — it still needs to be
      # recorded as applied so migration history matches the migrations
      # folder.) After that one-time baseline, plain `migrate deploy` works
      # normally for every future migration, which is why it's used here
      # rather than the db-execute/resolve dance ci.yml uses on its
      # always-fresh ephemeral database. (Correction to an earlier version
      # of this comment: "no new migration will ever need baselining again"
      # was wrong — see the auth-trigger note below. The baseline problem
      # is specifically about a migration needing to touch a schema the
      # connection role doesn't own; it can recur.)
      #
      # SECOND one-time step, likely needed the first time this workflow
      # runs 20260912000001_auth_trigger: that migration creates a TRIGGER
      # ON auth.users, which (per the same permission restriction proven
      # above) the pooler role probably can't do either. If this step fails
      # on that migration specifically: run its two SQL statements by hand
      # via Supabase Dashboard -> SQL Editor (elevated privileges there),
      # then:
      #   npx prisma migrate resolve --applied 20260912000001_auth_trigger --schema apps/api/prisma/schema.prisma
      # then re-run this workflow. A green CI run on this migration does
      # NOT predict production success -- CI's ephemeral Postgres owns its
      # own auth.users as superuser, so CREATE TRIGGER always succeeds
      # there regardless of what happens against the real database.
      #
      # THIRD one-time step, possibly needed on 20260913020000_backfill_
      # profile_names: its UPDATE statement reads auth.users (a SELECT, not
      # DDL this time), which the pooler role may equally lack a grant for.
      # Same fallback shape if this step fails on that migration
      # specifically: run its two statements by hand via Supabase Dashboard
      # -> SQL Editor, then
      #   npx prisma migrate resolve --applied 20260913020000_backfill_profile_names --schema apps/api/prisma/schema.prisma
      # (Confirmed in production: this one applied cleanly on the first
      # try, so the pooler role does have read access to auth.users here --
      # the fallback above is contingency documentation, not a report that
      # it was needed.)
      #
      # FOURTH one-time step, CONFIRMED NEEDED (unlike the first three,
      # which were contingencies) on 20260913015000_auth_users_meta_column:
      # its ALTER TABLE on auth.users failed in production with "must be
      # owner of table users" (42501) -- and unlike the SELECT/TRIGGER
      # cases above, this ISN'T a role-scoping issue the Supabase Dashboard
      # SQL Editor can get around: ALTERing auth.users structure is blocked
      # for everyone on a Supabase project, full stop. The column this
      # migration adds has always existed on real Supabase anyway (an
      # earlier migration already successfully read it), so there is
      # nothing to actually apply -- the fix is purely
      #   npx prisma migrate resolve --applied 20260913015000_auth_users_meta_column --schema apps/api/prisma/schema.prisma
      # with no SQL run by hand first. Once resolved, no future
      # `migrate deploy` run touches this migration again.
      #
      # FIFTH one-time step, CONFIRMED NEEDED on
      # 20261009235959_stub_storage_schema: same shape as the FOURTH case
      # above, just storage.buckets instead of auth.users -- CREATE SCHEMA/
      # TABLE IF NOT EXISTS against a Supabase-owned schema still needs
      # CREATE privilege to even attempt, which the pooler role doesn't
      # have, regardless of IF NOT EXISTS meaning it would've no-op'd
      # anyway. storage.buckets already has its real structure in
      # production (confirmed: 20261010000000_storage_bucket_limits, which
      # UPDATEs it, already applied successfully in an earlier deploy) --
      # there is nothing to actually apply, so again no SQL by hand, just:
      #   npx prisma migrate resolve --applied 20261009235959_stub_storage_schema --schema apps/api/prisma/schema.prisma
      # (CONFIRMED NEEDED and done, 2026-10-10 -- run through this workflow
      # itself as a one-time step, reusing its existing DATABASE_URL secret
      # rather than asking for the production connection string to be
      # typed into a local terminal. Removed again once it succeeded.)
      #
      # SIXTH one-time step, CONFIRMED NEEDED on
      # 20261010180000_storage_write_policies: CREATE POLICY on
      # storage.objects, unlike cases 4/5 (CREATE TABLE/ALTER TABLE, both
      # genuinely blocked for the pooler role at the schema/table-ownership
      # level), is a first-class Supabase customization point this role
      # CAN exercise -- confirmed live: the db-execute step hit "policy ...
      # already exists" on its very first statement (someone/something had
      # already created at least that one by the time this ran), not a
      # permission error. A dedicated apply_policies_only.sql (now
      # deleted, its content preserved below -- NOT folded into
      # migration.sql itself, since that file was already resolved as
      # applied by the time this was written, and prisma migrate resolve
      # records a checksum of the file at that moment; editing it
      # afterwards would cause a checksum-mismatch on every future
      # deploy) sat next to this migration's real migration.sql
      # specifically because migration.sql's own CREATE TABLE IF NOT
      # EXISTS stub (CI-only) would have hit the same schema-level error
      # case 5 did if run against production, before ever reaching the
      # policy statements that actually mattered:
      #   DROP POLICY IF EXISTS "avatars_write_own_folder" ON storage.objects;
      #   CREATE POLICY "avatars_write_own_folder" ON storage.objects FOR INSERT TO authenticated WITH CHECK (bucket_id = 'avatars' AND (storage.foldername(name))[1] = auth.uid()::text);
      #   DROP POLICY IF EXISTS "avatars_update_own_folder" ON storage.objects;
      #   CREATE POLICY "avatars_update_own_folder" ON storage.objects FOR UPDATE TO authenticated USING (bucket_id = 'avatars' AND (storage.foldername(name))[1] = auth.uid()::text) WITH CHECK (bucket_id = 'avatars' AND (storage.foldername(name))[1] = auth.uid()::text);
      #   DROP POLICY IF EXISTS "avatars_delete_own_folder" ON storage.objects;
      #   CREATE POLICY "avatars_delete_own_folder" ON storage.objects FOR DELETE TO authenticated USING (bucket_id = 'avatars' AND (storage.foldername(name))[1] = auth.uid()::text);
      #   DROP POLICY IF EXISTS "submissions_write_own_folder" ON storage.objects;
      #   CREATE POLICY "submissions_write_own_folder" ON storage.objects FOR ALL TO authenticated USING (bucket_id = 'submissions' AND (storage.foldername(name))[1] = auth.uid()::text) WITH CHECK (bucket_id = 'submissions' AND (storage.foldername(name))[1] = auth.uid()::text);
      # Fix, if this recurs for a similar future migration:
      #   npx prisma db execute --file <path>.sql --schema apps/api/prisma/schema.prisma
      #   npx prisma migrate resolve --applied <migration_name> --schema apps/api/prisma/schema.prisma
      # (--schema alone, not --url too -- this Prisma version rejects
      # both at once: "--url and --schema cannot be used at the same
      # time"; schema.prisma's datasource already reads DATABASE_URL via
      # env(), which the step's own env: block sets.)
      # (CONFIRMED NEEDED and done, 2026-10-10 -- run through this workflow
      # itself as a one-time step, reusing its existing DATABASE_URL secret
      # rather than asking for the production connection string to be
      # typed into a local terminal. Removed again once it succeeded.)
      - name: Apply pending migrations
        run: npm exec -w apps/api -- prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # TEMP, read-only diagnostic -- the four policies applied in the
      # SIXTH one-time step above were confirmed created, but a user retry
      # still hit the identical "new row violates row-level security
      # policy" error. Lists every policy actually on storage.objects
      # right now (name/command/restrictive-or-permissive/the expressions
      # themselves) rather than guessing further -- e.g. a pre-existing
      # RESTRICTIVE policy from an earlier manual setup attempt would
      # block every insert regardless of the new permissive ones passing,
      # since restrictive policies AND together with permissive ones
      # rather than OR. ubuntu-latest ships psql preinstalled. Removed
      # once the real cause is found.
      - name: TEMP -- list storage.objects policies
        run: |
          psql "$DATABASE_URL" -c "SELECT polname, polcmd, CASE WHEN polpermissive THEN 'PERMISSIVE' ELSE 'RESTRICTIVE' END AS kind, pg_get_expr(polqual, polrelid) AS using_expr, pg_get_expr(polwithcheck, polrelid) AS with_check_expr FROM pg_policy WHERE polrelid = 'storage.objects'::regclass ORDER BY polname;"
          psql "$DATABASE_URL" -c "SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE oid = 'storage.objects'::regclass;"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

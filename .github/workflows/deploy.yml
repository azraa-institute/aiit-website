name: Deploy

# apps/web deploys independently via Vercel's own GitHub integration once
# its Root Directory is set to apps/web — no step for it here.
#
# Single environment for now ("production") — there is no second Render
# service yet. Add a staging job here once one exists; same shape, different
# secrets/env.

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # apps/api has no native-binary deps affected by the lockfile issue
      # described in ci.yml, so a plain install is fine here.
      - run: npm install --workspace=apps/api

      # IMPORTANT — one-time manual step before this can succeed:
      # `prisma migrate deploy` refuses to run against a database that
      # already has tables in a schema it manages (P3005 "schema is not
      # empty"). Supabase's `auth` schema always pre-exists, so the very
      # first run of this workflow against a real Supabase DATABASE_URL
      # will hit this. Before that first run, baseline BOTH migrations by
      # hand, in order (see https://pris.ly/d/migrate-baseline):
      #   npx prisma db execute --file apps/api/prisma/migrations/20260910235959_stub_auth_schema/migration.sql --schema apps/api/prisma/schema.prisma --url "$DATABASE_URL"
      #   npx prisma db execute --file apps/api/prisma/migrations/20260911000000_init/migration.sql --schema apps/api/prisma/schema.prisma --url "$DATABASE_URL"
      #   npx prisma migrate resolve --applied 20260910235959_stub_auth_schema --schema apps/api/prisma/schema.prisma
      #   npx prisma migrate resolve --applied 20260911000000_init --schema apps/api/prisma/schema.prisma
      # (the stub migration's CREATE ... IF NOT EXISTS is a no-op against
      # real Supabase, which already has auth.users — it still needs to be
      # recorded as applied so migration history matches the migrations
      # folder.) After that one-time baseline, plain `migrate deploy` works
      # normally for every future migration, which is why it's used here
      # rather than the db-execute/resolve dance ci.yml uses on its
      # always-fresh ephemeral database. (Correction to an earlier version
      # of this comment: "no new migration will ever need baselining again"
      # was wrong — see the auth-trigger note below. The baseline problem
      # is specifically about a migration needing to touch a schema the
      # connection role doesn't own; it can recur.)
      #
      # SECOND one-time step, likely needed the first time this workflow
      # runs 20260912000001_auth_trigger: that migration creates a TRIGGER
      # ON auth.users, which (per the same permission restriction proven
      # above) the pooler role probably can't do either. If this step fails
      # on that migration specifically: run its two SQL statements by hand
      # via Supabase Dashboard -> SQL Editor (elevated privileges there),
      # then:
      #   npx prisma migrate resolve --applied 20260912000001_auth_trigger --schema apps/api/prisma/schema.prisma
      # then re-run this workflow. A green CI run on this migration does
      # NOT predict production success -- CI's ephemeral Postgres owns its
      # own auth.users as superuser, so CREATE TRIGGER always succeeds
      # there regardless of what happens against the real database.
      - name: Apply pending migrations
        run: npm exec -w apps/api -- prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

name: Deploy

# apps/web deploys independently via Vercel's own GitHub integration once
# its Root Directory is set to apps/web — no step for it here.
#
# Single environment for now ("production") — there is no second Render
# service yet. Add a staging job here once one exists; same shape, different
# secrets/env.

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # apps/api has no native-binary deps affected by the lockfile issue
      # described in ci.yml, so a plain install is fine here.
      - run: npm install --workspace=apps/api

      # IMPORTANT — one-time manual step before this can succeed:
      # `prisma migrate deploy` refuses to run against a database that
      # already has tables in a schema it manages (P3005 "schema is not
      # empty"). Supabase's `auth` schema always pre-exists, so the very
      # first run of this workflow against a real Supabase DATABASE_URL
      # will hit this. Before that first run, baseline it once by hand
      # (see https://pris.ly/d/migrate-baseline):
      #   npx prisma db execute --file apps/api/prisma/migrations/20260911000000_init/migration.sql --schema apps/api/prisma/schema.prisma --url "$DATABASE_URL"
      #   npx prisma migrate resolve --applied 20260911000000_init --schema apps/api/prisma/schema.prisma
      # After that one-time baseline, plain `migrate deploy` works normally
      # for every future migration, which is why it's used here rather than
      # the db-execute/resolve dance ci.yml uses on its always-fresh
      # ephemeral database.
      - name: Apply pending migrations
        run: npm exec -w apps/api -- prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14110f" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="/assets/brand/azraa-institute-of-information-technology-official-logo-black.png"
    />
    <!-- Google Sans: the site's UI/body typeface (--font-ui in tokens.css)
         -- body copy, buttons, forms and every other UI surface uses
         Google Sans, a free OFL-licensed geometric sans (in the same
         family as Grok's Universal Sans, which isn't freely licensed).

         Source Serif 4: the site's one serif identity, both for display
         headings (--font-display in tokens.css, since 2026-09 -- Georgia
         before that) and for the same deliberate accent role it always
         had (--font-accent, an alias of --font-display now, kept so
         files already written against it don't need touching). Loaded as
         the full variable range (upright + italic, weight 200-900) rather
         than enumerating specific static weights, since usages span
         everything from italic 500 script accents to upright 700 display
         headings: virtually every page's headings site-wide, the header
         nav + mobile menu (header.css, mobile-menu.css), the site search
         overlay (site-search.css), the homepage roadmap's AIIT Advantage
         bar (learning-ecosystem.css) and Learner's Journey accent words
         (vision-journey.css), the student-stories quote marks/script
         annotations, the legal document pages (legal-book.css), and the
         Affiliate/Blueprint/Why-Join/Resources pages' editorial headings
         (each scoped to its own page via a literal font-family, not
         --font-accent, per the comment at the top of that page's CSS).

         Dancing Script: one deliberate exception to the two-typeface system
         above -- a genuine script face (not just Source Serif 4's italic,
         which is used elsewhere for a quieter accent) for the course card's
         "Enroll now" CTA specifically, see course-card.css. Loaded only at
         600/700 (the weights actually used) rather than the full range.

         Alex Brush: a second, deliberately different script face -- a
         confident single-weight brush script (vs. Dancing Script's rounder,
         more open letterforms) for Quill's "Ask Quill about this course" CTA
         specifically, see course-detail.css. Ships one weight only (400) on
         Google Fonts; set font-weight: 400 wherever it's used rather than
         700, since there's no real bold to request and the browser would
         otherwise synthesize (stretch) a fake one, breaking the connected
         brush strokes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Initial paint + branded splash. Plain CSS, no JS, no dependencies —
         paints with the HTML so first load is a calm AIIT screen, never a
         blank flash. Removed by the app once the first route renders
         (see SplashGate in src/App.tsx). */
      html {
        background: #fbf8f2;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #fbf8f2;
        transition: opacity 320ms ease;
      }
      #splash.is-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 24px;
      }
      #splash img {
        display: block;
        height: 38px;
        width: auto;
      }
      #splash span {
        position: relative;
        display: block;
        width: 128px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(20, 17, 15, 0.09);
      }
      #splash span::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #7d6340, transparent);
        animation: splash-slide 1350ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-115%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash span::after {
          animation: none;
          width: 100%;
          background: rgba(20, 17, 15, 0.2);
        }
      }
    </style>
    <!-- Deliberately no static description/og:*/twitter:* tags here -- every
         route already renders its own via <Seo> (src/lib/Seo.tsx),
         react-helmet-async on the client. A static duplicate here isn't a
         "fallback": react-helmet-async only manages tags it rendered itself,
         so it never removes a pre-existing static one -- it just inserts
         its own alongside it, leaving two <meta name="description"> tags
         per page. Browsers use the first; so does every social-media
         link-preview bot (Facebook, Slack, Discord, WhatsApp, iMessage) --
         none of them execute JS, so they only ever see this static block,
         meaning every shared link showed the homepage's own generic
         preview regardless of which page was actually shared. <title> is
         the one exception worth keeping static: document.title is a single
         property, not an inserted element, so Helmet genuinely replaces it
         in place rather than duplicating it. -->
    <title>AIIT — Azraa Institute of Information Technology</title>
    <!-- Google Search Console's second ownership-verification method
         (Settings -> Ownership verification), alongside the standalone
         /googleadefb798b5f3ca8c.html file -- having two independent
         methods means verification survives either one breaking on its
         own. Not managed by <Seo>/react-helmet-async, so no duplicate-tag
         risk the way a static description/og:* tag would have; this one
         has to stay here permanently either way. -->
    <meta name="google-site-verification" content="jHYril7l4HA_3GkDxvdVhxtnZfWP-6FDyFLTITrTBZI" />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Loading AIIT">
      <div>
        <img
          src="/assets/brand/azraa-institute-of-information-technology-official-logo-black.png"
          alt="AIIT — Azraa Institute of Information Technology"
          width="198"
          height="38"
        />
        <span aria-hidden="true"></span>
      </div>
    </div>
    <script>
      /* Safety net: never let the splash outlive a broken bootstrap. */
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('is-out');
        setTimeout(function () {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 400);
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
